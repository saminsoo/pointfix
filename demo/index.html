<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PointFix demo shop</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1c1917; background: #fafaf9; }
      header { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 24px; padding: 0 24px; height: 64px; background: rgba(255,255,255,.95); border-bottom: 1px solid #e7e5e4; }
      header nav { display: flex; gap: 16px; }
      header a { color: inherit; text-decoration: none; font-weight: 600; }
      .layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; padding: 24px 24px 120px; }
      aside { position: sticky; top: 88px; max-height: calc(100vh - 200px); overflow-y: auto; background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 16px; }
      aside button { display: block; width: 100%; margin: 8px 0; min-height: 44px; border-radius: 12px; border: 1px solid #d6d3d1; background: #fff; font: inherit; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
      .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; overflow: hidden; }
      /* A cropped thumbnail positioned like many photo apps do it (the case html2canvas gets wrong). */
      .thumb { position: relative; aspect-ratio: 1; overflow: hidden; background: #e7e5e4; }
      .thumb span { position: absolute; left: -25%; top: -10%; width: 150%; height: 120%; }
      .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
      .cover { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
      .card p { margin: 0; padding: 12px; }
      .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #fff; border-top: 1px solid #e7e5e4; box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
      .bar button { min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: #f97316; font: inherit; font-weight: 700; }
      @media (max-width: 767px) { .layout { grid-template-columns: 1fr; } aside { position: static; max-height: none; } }
    </style>
  </head>
  <body>
    <header>
      <strong>Demo shop</strong>
      <nav><a href="#">Prints</a><a href="#">Books</a><a href="#">Canvas</a></nav>
    </header>
    <div class="layout">
      <aside aria-label="Tools">
        <h2 style="margin-top: 0">Tools</h2>
        <button>Add photos</button><button>New order</button><button>Save for later</button>
        <p>Sizes</p>
        <button>10×15</button><button>13×18</button><button>15×20</button><button>20×25</button><button>20×30</button><button>30×40</button>
      </aside>
      <main>
        <h1>Your photos</h1>
        <div class="grid">
          <div class="card"><div class="thumb"><span><img src="/photo-1.svg" alt="Photo 1" /></span></div><p>Cropped thumbnail</p></div>
          <div class="card"><div class="thumb"><span><img src="/photo-2.svg" alt="Photo 2" /></span></div><p>Cropped thumbnail</p></div>
          <div class="card"><img class="cover" src="/photo-3.svg" alt="Photo 3" /><p>object-fit: cover</p></div>
          <div class="card"><img class="cover" src="/photo-4.svg" alt="Photo 4" /><p>object-fit: cover</p></div>
          <div class="card"><div class="thumb"><span><img src="/photo-5.svg" alt="Photo 5" /></span></div><p>Cropped thumbnail</p></div>
          <div class="card"><img class="cover" src="/photo-6.svg" alt="Photo 6" /><p>object-fit: cover</p></div>
        </div>
      </main>
    </div>
    <div class="bar"><span><strong>$12.40</strong> · 8 prints</span><button>Add to cart</button></div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const lang = params.get("lang");
      if (lang) document.documentElement.lang = lang;
      const { mountPointFix } = await import("/pointfix-widget.js");
      // In a real project with a bundler: mountPointFix({ loadHtml2Canvas: () => import("html2canvas-pro") })
      // ?tab=1 tries the exact tab capture (the browser asks for permission each time).
      mountPointFix({ bottomOffset: "88px", tabCapture: params.get("tab") === "1" });
    </script>
  </body>
</html>
